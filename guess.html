<!doctype html>
<html lang="zh-CN">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="robots" content="noindex,nofollow">
    <title>MBTI Code 管理</title>
    <link rel="shortcut icon" href="./static/img/favicon.ico">
    <link rel="stylesheet" href="./static/css/bootstrap.min.css">
    <style>
        body {
            min-height: 100vh;
            margin: 0;
            padding: 48px 20px;
            background: #f5f2ed;
            color: #1f1f1f;
            font-family: Arial, "Microsoft YaHei", sans-serif;
        }

        .admin-shell {
            max-width: 920px;
            margin: 0 auto;
        }

        .admin-header {
            margin-bottom: 28px;
        }

        .admin-header h1 {
            margin: 0 0 8px;
            font-size: 30px;
            font-weight: 700;
        }

        .admin-panel {
            margin-bottom: 20px;
            padding: 24px;
            border: 1px solid #e2ddd5;
            border-radius: 8px;
            background: #fff;
        }

        .admin-panel h2 {
            margin: 0 0 16px;
            font-size: 20px;
        }

        .button-row {
            display: flex;
            flex-wrap: wrap;
            gap: 12px;
        }

        .status-box {
            margin-top: 16px;
            padding: 14px;
            min-height: 52px;
            border-radius: 6px;
            background: #f8f8f8;
            white-space: pre-wrap;
        }

        label {
            font-weight: 600;
        }
    </style>
</head>

<body>
    <main class="admin-shell">
        <header class="admin-header">
            <h1>MBTI Code 管理</h1>
            <p>生成邀请码、导出 code、导出测试结果，并查询单个 code 的使用状态。</p>
        </header>

        <section class="admin-panel">
            <h2>管理密码</h2>
            <label for="admin-password">密码</label>
            <input class="form-control" id="admin-password" type="password" autocomplete="current-password">
        </section>

        <section class="admin-panel">
            <h2>导出</h2>
            <div class="button-row">
                <button class="btn btn-primary" id="generate-codes" type="button">生成 50 个 code 并下载</button>
                <button class="btn btn-default" id="export-codes" type="button">下载全部 code</button>
                <button class="btn btn-default" id="export-results" type="button">下载测试结果</button>
            </div>
            <div class="status-box" id="download-status"></div>
        </section>

        <section class="admin-panel">
            <h2>查询 code</h2>
            <label for="lookup-code">code</label>
            <input class="form-control" id="lookup-code" type="text" autocomplete="off">
            <button class="btn btn-info" id="lookup-submit" type="button" style="margin-top: 14px;">查询状态</button>
            <div class="status-box" id="lookup-result"></div>
        </section>
    </main>

    <script>
        (function () {
            function getPassword() {
                return document.getElementById('admin-password').value;
            }

            function setStatus(id, message) {
                document.getElementById(id).textContent = message || '';
            }

            function downloadBlob(blob, filename) {
                var url = URL.createObjectURL(blob);
                var link = document.createElement('a');
                link.href = url;
                link.download = filename;
                document.body.appendChild(link);
                link.click();
                link.remove();
                URL.revokeObjectURL(url);
            }

            function filenameFromResponse(response, fallback) {
                var disposition = response.headers.get('content-disposition') || '';
                var match = disposition.match(/filename="([^"]+)"/i);
                return match ? match[1] : fallback;
            }

            function requestDownload(url, method, fallbackFilename) {
                var password = getPassword();

                if (!password) {
                    setStatus('download-status', '请先输入管理密码。');
                    return;
                }

                setStatus('download-status', '处理中...');

                fetch(url, {
                    method: method || 'GET',
                    headers: {
                        'x-admin-password': password
                    }
                })
                    .then(function (response) {
                        if (!response.ok) {
                            return response.json().then(function (data) {
                                throw new Error(data.message || '请求失败。');
                            });
                        }

                        return response.blob().then(function (blob) {
                            downloadBlob(blob, filenameFromResponse(response, fallbackFilename));
                        });
                    })
                    .then(function () {
                        setStatus('download-status', '完成，文件已开始下载。');
                    })
                    .catch(function (error) {
                        setStatus('download-status', error.message || '请求失败。');
                    });
            }

            document.getElementById('generate-codes').addEventListener('click', function () {
                requestDownload('/api/admin/generate-codes', 'POST', 'codes.csv');
            });

            document.getElementById('export-codes').addEventListener('click', function () {
                requestDownload('/api/admin/export-codes', 'GET', 'all-codes.csv');
            });

            document.getElementById('export-results').addEventListener('click', function () {
                requestDownload('/api/admin/export-results', 'GET', 'test-results.csv');
            });

            document.getElementById('lookup-submit').addEventListener('click', function () {
                var password = getPassword();
                var code = document.getElementById('lookup-code').value.trim().toUpperCase();

                if (!password || !code) {
                    setStatus('lookup-result', '请填写管理密码和 code。');
                    return;
                }

                setStatus('lookup-result', '查询中...');

                fetch('/api/admin/code-status?code=' + encodeURIComponent(code), {
                    headers: {
                        'x-admin-password': password
                    }
                })
                    .then(function (response) {
                        return response.json().then(function (data) {
                            if (!response.ok || !data.ok) {
                                throw new Error(data.message || '查询失败。');
                            }

                            return data.code;
                        });
                    })
                    .then(function (item) {
                        setStatus('lookup-result', [
                            'code: ' + item.code,
                            '状态: ' + item.status,
                            '创建时间: ' + (item.created_at || ''),
                            '使用时间: ' + (item.used_at || '未使用'),
                            '小红书用户名: ' + (item.redbook_username || ''),
                            'MBTI: ' + (item.result_type || '')
                        ].join('\n'));
                    })
                    .catch(function (error) {
                        setStatus('lookup-result', error.message || '查询失败。');
                    });
            });
        })();
    </script>
</body>

</html>
