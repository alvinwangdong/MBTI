<!doctype html>
<html lang="zh-CN">

<head>
    <meta charset="utf-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="description" content="MBTI 职业性格测试共 93 题，基于四个维度计算人格类型，并跳转到对应的人格解析页面。">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="keywords" content="MBTI,MBTI测试,职业性格测试,人格测试">
    <link rel="canonical" href="https://mbti.msktmi.com/mbti-test.html">
    <title>MBTI 职业性格测试 - 93 题</title>
    <link rel="shortcut icon" href="./static/img/favicon.ico">
    <link rel="stylesheet" type="text/css" href="./static/css/site.css" />
    <link rel="stylesheet" href="./static/css/bootstrap.min.css">
    <link rel="stylesheet" href="./static/css/svgcheckbx.css">
    <script type="text/javascript" src="./static/js/vendor/jquery-3.7.1.min.js"></script>
    <script src="./static/js/vendor/bootstrap.min.js"></script>
    <script src="./static/js/common/scoring.js"></script>
    <script src="./static/js/pages/mbti-test.js"></script>
    <script src="./static/js/common/project-info.js"></script>
    <style>
        body {
            min-height: 100%;
        }

        .questionbox {
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .access-gate {
            max-width: 480px;
            margin: 0 auto 60px;
            padding: 28px;
            background: rgba(255, 255, 255, 0.94);
            border-radius: 8px;
            box-shadow: 0 16px 40px rgba(0, 0, 0, 0.16);
        }

        .access-gate h1 {
            margin: 0 0 12px;
            font-size: 26px;
        }

        .access-gate p {
            color: #555;
            line-height: 1.7;
        }

        .access-gate label {
            margin-top: 14px;
            font-weight: 600;
        }

        .access-gate input {
            height: 42px;
        }

        .access-gate button {
            width: 100%;
            margin-top: 20px;
            height: 44px;
        }

        .gate-message {
            min-height: 24px;
            margin-top: 12px;
            color: #555;
        }

        .gate-message-error {
            color: #b00020;
        }
    </style>
</head>

<body>
    <!-- 测试页只承载导航和题目容器，题目内容由 JS 动态生成。 -->
    <div class="navbar navbar-default" style="margin-bottom: 10em;">
        <div class="container">
            <div class="navbar-header">
                <a href="./index.html" class="navbar-brand">MBTI</a>
                <button class="navbar-toggle" type="button" data-toggle="collapse" data-target="#navbar-main"
                    aria-label="切换导航菜单">
                    <span class="icon-bar"></span>
                    <span class="icon-bar"></span>
                    <span class="icon-bar"></span>
                </button>
            </div>
            <div class="navbar-collapse collapse" id="navbar-main">
                <ul class="nav navbar-nav">
                    <li>
                        <a href="./personality-types.html">十六种人格简介</a>
                    </li>
                </ul>
            </div>
        </div>
    </div>

    <div class="container">
        <section class="access-gate" id="access-gate">
            <h1>领取专属测试结果</h1>
            <p>请输入你的小红书用户名和我发给你的测试 code。测试完成并展示结果后，这个 code 会自动标记为已使用。</p>
            <form id="access-form" autocomplete="off">
                <label for="redbook-username">小红书用户名</label>
                <input class="form-control" id="redbook-username" name="redbookUsername" type="text" required>
                <label for="access-code">测试 code</label>
                <input class="form-control" id="access-code" name="code" type="text" required>
                <button class="btn btn-primary" id="gate-submit" type="submit">开始测试</button>
                <div class="gate-message" id="gate-message" aria-live="polite"></div>
            </form>
        </section>

        <div class="questionbox" id="test-area" style="display: none;">
            <!-- JS 会把 questions.json 渲染成一题一屏的单选表单。 -->
            <div class="flexWidth" id="mbtiquestion">
                <!-- topic -->
            </div>
        </div>
    </div>

</body>

</html>
