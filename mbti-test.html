<!doctype html>
<html lang="zh-CN">

<head>
    <meta charset="utf-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="description" content="MBTI 职业性格测试共 93 题，基于四个维度计算人格类型，并跳转到对应的人格解析页面。">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="keywords" content="MBTI,MBTI测试,职业性格测试,人格测试">
    <link rel="canonical" href="https://mbti.msktmi.com/mbti-test.html">
    <title>MBTI 职业性格测试 - 93 题</title>
    <link rel="shortcut icon" href="./static/img/favicon.ico">
    <link rel="stylesheet" href="./static/css/bootstrap.min.css?v=20260515-ui2">
    <link rel="stylesheet" href="./static/css/site.css?v=20260515-ui2">
    <script src="./static/js/vendor/jquery-3.7.1.min.js?v=20260515-ui2"></script>
    <script src="./static/js/vendor/bootstrap.min.js?v=20260515-ui2"></script>
    <script src="./static/js/common/scoring.js?v=20260515-ui2"></script>
    <script src="./static/js/pages/mbti-test.js?v=20260515-ui2"></script>
    <script src="./static/js/common/project-info.js?v=20260515-ui2"></script>
</head>

<body>
    <nav class="navbar navbar-default navbar-fixed-top">
        <div class="container">
            <div class="navbar-header">
                <a href="./index.html" class="navbar-brand">MBTI</a>
                <button class="navbar-toggle" type="button" data-toggle="collapse" data-target="#navbar-main"
                    aria-label="切换导航菜单">
                    <span class="icon-bar"></span>
                    <span class="icon-bar"></span>
                    <span class="icon-bar"></span>
                </button>
            </div>
            <div class="navbar-collapse collapse" id="navbar-main">
                <ul class="site-nav-links">
                    <li><a href="./index.html">首页</a></li>
                    <li><a href="./mbti-test.html">开始测评</a></li>
                    <li><a href="./personality-types.html">人格解析</a></li>
                </ul>
            </div>
        </div>
    </nav>

    <main class="page-shell test-shell">
        <section class="access-gate soft-card" id="access-gate">
            <p class="gold-note">专属测评入口</p>
            <h1>领取专属测试结果</h1>
            <p>请输入你的小红书用户名和我发给你的测试 code。测试完成并展示结果后，这个 code 会自动标记为已使用。</p>
            <form id="access-form" autocomplete="off">
                <label for="redbook-username">小红书用户名</label>
                <input class="form-control" id="redbook-username" name="redbookUsername" type="text" required>
                <label for="access-code">测试 code</label>
                <input class="form-control" id="access-code" name="code" type="text" required>
                <button class="btn btn-primary" id="gate-submit" type="submit">开始测试</button>
                <div class="gate-message" id="gate-message" aria-live="polite"></div>
            </form>
        </section>

        <section class="questionbox" id="test-area" style="display: none;">
            <div class="quiz-card soft-card" id="mbtiquestion">
                <div class="quiz-progress">
                    <div class="quiz-progress-copy">
                        <span id="progress-text">第 1 / 93 题</span>
                        <span id="progress-percent">0%</span>
                    </div>
                    <div class="quiz-progress-track" aria-hidden="true">
                        <div class="quiz-progress-bar" id="progress-bar"></div>
                    </div>
                </div>

                <form class="quiz-form" id="question-form" autocomplete="off">
                    <fieldset>
                        <legend id="question-title">题目加载中...</legend>
                        <div class="quiz-options" id="question-options"></div>
                    </fieldset>
                </form>

                <div class="quiz-actions">
                    <button class="secondary-button" id="prev-question" type="button">上一题</button>
                    <button class="primary-button" id="next-question" type="button">下一题</button>
                </div>
                <p class="quiz-message" id="quiz-message" aria-live="polite"></p>
            </div>
        </section>
    </main>

</body>

</html>
